name: CI/CD Pipeline

on:
  push:
    #branches:
    #  - main
    #   - feature/**
    tags:
      - 'v*'  # Trigger on version tags
  pull_request:
    branches:
      - master

jobs:
  determine-config:
    runs-on: ubuntu-latest
    outputs:
      build_config: ${{ steps.config.outputs.build_config }}
    
    steps:
      - name: Determine build configuration
        id: config
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/master" || "$GITHUB_REF" == refs/tags/* ]]; then
            echo "build_config=Release" >> $GITHUB_OUTPUT
          else
            echo "build_config=Debug" >> $GITHUB_OUTPUT
          fi
        shell: bash

  build-and-test:
    needs: determine-config
    runs-on: ubuntu-latest
        
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for semantic versioning
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'      
      
      - name: Display build configuration
        run: |
          echo "========================================"
          echo "Build Configuration: ${{ needs.determine-config.outputs.build_config }}"
          echo "Branch: ${{ github.ref }}"
          echo "========================================"
        shell: bash
      
      - name: Restore dependencies
        run: dotnet restore src/DreamersCode.PublicProjectTemplate.slnx
      
      - name: Build solution
        run: dotnet build src/DreamersCode.PublicProjectTemplate.slnx --configuration ${{ needs.determine-config.outputs.build_config }} --no-restore
      
      - name: Run tests
        run: dotnet test src/DreamersCode.PublicProjectTemplate.slnx --configuration ${{ needs.determine-config.outputs.build_config }} --no-build --verbosity normal

  publish-nuget:
    needs: [build-and-test, determine-config]
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'push'
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for MinVer to work
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Display build configuration
        run: |
          echo "========================================"
          echo "Build Configuration: ${{ needs.determine-config.outputs.build_config }}"
          echo "Branch: ${{ github.ref }}"
          echo "========================================"
        shell: bash
      
      - name: Install MinVer CLI tool
        run: dotnet tool install --global minver-cli
      
      - name: Get MinVer version
        id: minver
        run: |
          raw=$(minver -t v)
          version=${raw#v}
          echo "========================================"
          echo "Package Version: $version"
          echo "========================================"
          echo "version=$version" >> $GITHUB_OUTPUT
        shell: bash
      
      - name: Restore dependencies
        run: dotnet restore src/DreamersCode.PublicProjectTemplate.slnx
            
      - name: Pack NuGet package
        run: dotnet pack src/DreamersCode.PublicProjectTemplate/DreamersCode.PublicProjectTemplate.csproj --configuration ${{ needs.determine-config.outputs.build_config }} --output ./nuget -p:Version=${{ steps.minver.outputs.version }} -p:MinVerSkip=true        
      
      - name: Display NuGet package info
        run: |
          echo "========================================"
          echo "Publishing NuGet Package:"
          echo "Version: ${{ steps.minver.outputs.version }}"
          ls -la ./nuget/*.nupkg
          echo "========================================"
        shell: bash
      
        # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} 

      # Push the package
      - name: NuGet push
        run: dotnet nuget push ./nuget/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
        
